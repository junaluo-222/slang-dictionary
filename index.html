<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缩写词典 · 说人话版</title>
<style>
  :root{
    --net:#ff7a45;   --net-bg:#fff3ec;
    --pro:#2f6fed;   --pro-bg:#eef4ff;
    --cir:#12b886;   --cir-bg:#e6faf3;
    --ink:#1f2430;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f4f6fb;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}

  header{background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;padding:54px 20px 38px;text-align:center;}
  header h1{font-size:2rem;letter-spacing:1px;}
  header .sub{opacity:.9;margin-top:8px;font-size:.95rem;}

  .search{display:flex;gap:10px;max-width:560px;margin:24px auto 0;}
  .search input{flex:1;padding:14px 18px;border:none;border-radius:12px;
    font-size:16px;outline:none;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .search button{padding:0 26px;border:none;border-radius:12px;cursor:pointer;
    background:#1f2430;color:#fff;font-size:15px;font-weight:600;transition:.2s;}
  .search button:hover{background:#000;}

  .tabs{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .tabs button{padding:7px 18px;border-radius:999px;cursor:pointer;font-size:14px;
    border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;transition:.2s;}
  .tabs button.active{background:#fff;color:#5a3fb8;border-color:#fff;font-weight:600;}

  main{max-width:820px;margin:0 auto;padding:26px 18px 80px;}

  .hot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:13px;color:#8a90a0;margin-bottom:18px;}
  .hot button{padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;
    border:1px solid #e3e7f0;background:#fff;color:#4a5164;transition:.2s;}
  .hot button:hover{border-color:#b9c2ff;color:#4a3fd0;}

  .stat{font-size:13px;color:#9aa0b0;margin-bottom:14px;}

  .card{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;
    box-shadow:0 2px 14px rgba(30,40,80,.07);animation:up .25s ease both;}
  @keyframes up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .card-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .card-head h2{font-size:1.5rem;letter-spacing:.5px;font-weight:700;}
  .card-head .count{font-size:12px;color:#9aa0b0;}

  .meaning{padding:14px 16px;border-radius:10px;background:#fafbfd;
    margin-bottom:12px;border-left:3px solid #ddd;}
  .meaning:last-child{margin-bottom:0;}
  .meaning.net{border-left-color:var(--net);}
  .meaning.pro{border-left-color:var(--pro);}

  .m-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{font-size:12px;padding:2px 9px;border-radius:6px;font-weight:600;}
  .badge.net{background:var(--net-bg);color:var(--net);}
  .badge.pro{background:var(--pro-bg);color:var(--pro);}
  .field{font-size:13px;color:#6b7285;}

  .full{font-weight:600;margin:7px 0 8px;font-size:15px;}

  .plain{background:#fffbe8;border:1px dashed #f0d98a;border-radius:8px;
    padding:10px 12px;font-size:14.5px;color:#4a4636;}
  .plain .tag{display:inline-block;font-size:11px;font-weight:700;background:#ffd75e;
    color:#7a5a00;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px;}
  .example{font-size:13px;color:#9aa0b0;margin-top:8px;}

  .circle-card{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;
    box-shadow:0 2px 14px rgba(30,40,80,.07);
    border-top:3px solid var(--cir);animation:up .25s ease both;}
  .circle-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .c-icon{font-size:26px;line-height:1;flex-shrink:0;}
  .circle-head h3{font-size:1.2rem;margin-bottom:4px;}
  .c-intro{font-size:14px;color:#6b7285;}

  .slang-grid{display:grid;gap:9px;}
  .slang{background:var(--cir-bg);border-radius:9px;padding:10px 13px;}
  .s-t{display:inline-block;font-weight:700;color:#0b8a63;font-size:14.5px;margin-right:6px;}
  .s-d{font-size:14px;color:#3f4a56;}
  .s-e{display:block;font-size:12.5px;color:#8fa3a0;margin-top:4px;}

  mark{background:#fff2a8;padding:0 2px;border-radius:3px;}

  .empty{text-align:center;padding:70px 20px;color:#9aa0b0;}
  .empty strong{display:block;font-size:1.1rem;color:#5b6274;margin-bottom:8px;}

  .submit-box{background:#fff;border-radius:14px;padding:20px 22px;
    box-shadow:0 2px 14px rgba(30,40,80,.07);margin-top:26px;}
  .submit-box h3{font-size:1.05rem;margin-bottom:6px;}
  .submit-box p{font-size:13px;color:#8a90a0;margin-bottom:12px;}
  .submit-box textarea{width:100%;height:120px;padding:12px;border:1px solid #e3e7f0;
    border-radius:9px;font-size:13px;font-family:monospace;resize:vertical;
    outline:none;color:var(--ink);}
  .submit-box textarea:focus{border-color:#b9c2ff;}
  .submit-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .submit-actions button{padding:9px 18px;border:none;border-radius:9px;cursor:pointer;
    font-size:14px;font-weight:600;transition:.2s;}
  .btn-gen{background:#2f6fed;color:#fff;}
  .btn-gen:hover{background:#1f5bd0;}
  .btn-copy{background:#eef4ff;color:#2f6fed;}
  .btn-copy:hover{background:#dbe7ff;}

  .tip{background:#eef4ff;border-radius:12px;padding:16px 18px;font-size:13.5px;
    color:#40506b;margin-top:20px;line-height:1.75;}
  .tip b{color:#2f6fed;}

  @media (max-width:520px){
    header{padding:38px 16px 30px;}
    header h1{font-size:1.5rem;}
    .search button{padding:0 16px;font-size:14px;}
    .card,.circle-card{padding:16px;}
    .card-head h2{font-size:1.3rem;}
    .plain{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <h1>缩写词典 · 说人话版</h1>
  <p class="sub">一个简称，多种含义 —— 用大白话告诉你它到底啥意思</p>

  <div class="search">
    <input id="q" type="search" placeholder="输入简称或圈子，如 PR、CP、水印圈…" autocomplete="off">
    <button id="btn">查询</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-cat="all" class="active">全部</button>
    <button data-cat="net">网络梗</button>
    <button data-cat="pro">专业术语</button>
    <button data-cat="circle">圈子</button>
  </div>
</header>

<main>
  <div class="hot" id="hot"></div>
  <div class="stat" id="stat"></div>
  <div id="result"></div>

  <div class="submit-box">
  <h3>✍️ 提交新词</h3>
  <p>填好中文信息，点「生成 JSON」，复制结果发给维护者收录。</p>
  
  <div style="display:grid; gap:10px; margin-bottom:12px;">
    <input type="text" id="f-abbr" placeholder="缩写字母（如：YYDS）" style="padding:10px; border:1px solid #e3e7f0; border-radius:9px; font-size:14px; outline:none;">
    <select id="f-type" style="padding:10px; border:1px solid #e3e7f0; border-radius:9px; font-size:14px; outline:none; color:var(--ink);">
      <option value="net">网络梗 / 流行语</option>
      <option value="pro">专业术语 / 行业黑话</option>
    </select>
    <input type="text" id="f-field" placeholder="所属领域（如：网络流行语）" style="padding:10px; border:1px solid #e3e7f0; border-radius:9px; font-size:14px; outline:none;">
    <input type="text" id="f-full" placeholder="全称 / 正式说法（如：永远的神）" style="padding:10px; border:1px solid #e3e7f0; border-radius:9px; font-size:14px; outline:none;">
    <textarea id="f-plain" placeholder="大白话解释（让普通人能看懂）" style="padding:10px; border:1px solid #e3e7f0; border-radius:9px; font-size:14px; outline:none; height:60px; font-family:inherit; resize:vertical;"></textarea>
    <input type="text" id="f-example" placeholder="例句（可选，如：这版翻唱 yyds）" style="padding:10px; border:1px solid #e3e7f0; border-radius:9px; font-size:14px; outline:none;">
  </div>

  <div class="submit-actions">
    <button class="btn-gen" id="genBtn">生成 JSON</button>
    <button class="btn-copy" id="copyBtn">复制结果</button>
  </div>
  <textarea id="subInput" readonly placeholder="点击「生成 JSON」后，代码会出现在这里" style="height:80px; margin-top:10px; background:#fafbfd; color:#6b7285;"></textarea>
</div>

  <div class="tip">
    <b>数据来源：</b>本地手工维护的高频词条 + 圈子黑话，
    启动时会尝试从开源词库 nbnhhsh 拉取补充（拉取失败自动跳过，不影响使用）。
    想永久扩充词库，直接在代码里的 <b>LOCAL_TERMS</b> 和 <b>CIRCLES</b> 两个数组中添加即可。
  </div>
</main>

<script>
/* =========================================================
   一、本地缩写词条库（手工维护主库）
   freq 常用度 1~5，越大越靠前
   ========================================================= */
const LOCAL_TERMS = [
  /* ============ 网络流行语 / 梗 ============ */
  {abbr:"yyds", freq:5, meanings:[{type:"net", field:"网络流行语", full:"永远的神",
    plain:"拼音首字母缩写，夸人或者夸东西强到离谱，相当于“无敌了”。最早用来形容电竞选手。",
    example:"这版翻唱 yyds！"}]},
  {abbr:"xswl", freq:5, meanings:[{type:"net", field:"网络流行语", full:"笑死我了",
    plain:"拼音首字母缩写，看到特别好笑的东西时用。",
    example:"这评论区 xswl。"}]},
  {abbr:"awsl", freq:5, meanings:[{type:"net", field:"网络流行语", full:"啊我死了",
    plain:"拼音首字母缩写，看到特别可爱、特别心动的东西时用，意思是“可爱到受不了了”。",
    example:"这只猫 awsl。"}]},
  {abbr:"emo", freq:5, meanings:[{type:"net", field:"网络流行语", full:"emotional（情绪化）",
    plain:"指情绪低落、伤感、有点丧。常说“我 emo 了”，就是心情不好了。",
    example:"深夜听情歌，直接 emo 了。"}]},
  {abbr:"PUA", freq:5, meanings:[{type:"net", field:"情感 / 职场", full:"Pick-up Artist（原义：搭讪技巧）",
    plain:"原本指教人怎么搭讪、追人的一套方法。现在意思变了，主要指“不断贬低你、让你觉得自己很差，从而控制你”。恋爱、职场、朋友之间都可能出现。",
    example:"别被领导 PUA 了，干不好不是你的问题。"}]},
  {abbr:"内卷", freq:5, meanings:[{type:"net", field:"网络流行语", full:"Involution（学术原义）",
    plain:"本来是个学术词，指“大家拼命竞争，但整体没有进步”。现在就是“所有人都在无意义地加码”：别人加班到八点，你就得加到九点，但谁也没多拿钱。",
    example:"全公司都在加班，纯纯内卷。"}]},
  {abbr:"破防", freq:5, meanings:[{type:"net", field:"网络流行语", full:"心理防线被击破",
    plain:"原本是游戏里“防御被打破”的意思，现在指被某件事戳中，突然情绪失控、绷不住了。",
    example:"看到这条评论我直接破防了。"}]},
  {abbr:"躺平", freq:5, meanings:[{type:"net", field:"网络流行语", full:"不再拼命竞争",
    plain:"指放弃努力奋斗，只求过得去就行。不是完全不动，而是“不争不抢，够活就行”。",
    example:"卷不动了，我选择躺平。"}]},
  {abbr:"摆烂", freq:5, meanings:[{type:"net", field:"网络流行语", full:"破罐子破摔",
    plain:"比躺平更消极，指事情已经这样了，干脆不管了、任它烂下去。",
    example:"既然做不完，那就摆烂吧。"}]},
  {abbr:"打工人", freq:5, meanings:[{type:"net", field:"网络流行语", full:"上班族的自嘲称呼",
    plain:"所有靠上班赚钱的人的统称，带点自嘲和无奈。",
    example:"早安，打工人。"}]},
  {abbr:"牛马", freq:4, meanings:[{type:"net", field:"网络流行语", full:"打工人自嘲",
    plain:"把自己比作牛和马，意思是像牲口一样辛苦干活、任人使唤。",
    example:"今天又是当牛马的一天。"}]},
  {abbr:"草台班子", freq:4, meanings:[{type:"net", field:"网络流行语", full:"世界是个草台班子",
    plain:"原指松散拼凑的剧团。现在用来吐槽“那些看起来高大上的机构，其实内部也很混乱、很不专业”。",
    example:"看完他们的操作，只能说世界是个草台班子。"}]},
  {abbr:"大冤种", freq:4, meanings:[{type:"net", field:"网络流行语", full:"大冤种",
    plain:"指吃了亏、受了委屈、还被人当冤大头的人。",
    example:"原价买完第二天就打折，我就是大冤种。"}]},
  {abbr:"芭比Q", freq:4, meanings:[{type:"net", field:"网络流行语", full:"barbecue 的谐音",
    plain:"意思是“完蛋了”“烤糊了”，事情搞砸时用。",
    example:"忘了保存，芭比Q了。"}]},
  {abbr:"班味儿", freq:4, meanings:[{type:"net", field:"网络流行语 / 职场", full:"上班上出来的疲惫感",
    plain:"指一个人因为长期上班而散发出来的疲惫、麻木气质。",
    example:"放假也洗不掉身上的班味儿。"}]},
  {abbr:"种草", freq:4, meanings:[{type:"net", field:"网络流行语 / 消费", full:"推荐购买",
    plain:"看到别人推荐某个东西，自己也心动了、想买了，就叫“被种草”。反过来不想买了叫“拔草”。",
    example:"这条视频又给我种草了一堆东西。"}]},
  {abbr:"拔草", freq:3, meanings:[{type:"net", field:"网络流行语 / 消费", full:"打消购买念头",
    plain:"跟“种草”相反，本来想买，后来不想买了，或者买了之后发现不好。",
    example:"看了测评之后直接拔草了。"}]},
  {abbr:"搭子", freq:4, meanings:[{type:"net", field:"网络流行语", full:"搭伙做某件事的伙伴",
    plain:"比朋友浅一层、比陌生人近一层的关系。一起吃饭的叫“饭搭子”，一起运动的叫“运动搭子”。",
    example:"找个周末爬山搭子。"}]},
  {abbr:"情绪价值", freq:4, meanings:[{type:"net", field:"网络流行语", full:"让人感到开心的能力",
    plain:"指一个人能不能让身边的人觉得舒服、开心、被理解。能哄你开心就是“提供情绪价值高”。",
    example:"跟他在一块儿情绪价值拉满。"}]},
  {abbr:"乐子人", freq:4, meanings:[{type:"net", field:"网络流行语", full:"纯看热闹的人",
    plain:"不站队、不投入感情，纯粹来看热闹、图一乐的人。",
    example:"我就是个乐子人，谁赢都行。"}]},
  {abbr:"鼠鼠", freq:3, meanings:[{type:"net", field:"网络流行语 / 贴吧", full:"自称老鼠的人",
    plain:"自嘲用语，把自己比作躲在角落里的老鼠，表示自己普通、没存在感、混得不好。",
    example:"鼠鼠我啊，是真的不行。"}]},
  {abbr:"抽象", freq:4, meanings:[{type:"net", field:"网络流行语", full:"荒诞 / 离谱",
    plain:"原意是“看不懂、不具体”。在网络语境里表示“离谱到让人无法理解”，也可以指专门搞怪、玩梗的风格。",
    example:"这视频太抽象了，我看不懂。"}]},
  {abbr:"缝合", freq:3, meanings:[{type:"net", field:"网络流行语", full:"把别人的东西拼起来",
    plain:"指把几个现成的东西硬拼在一起，做成一个“新”东西。常带贬义，指没原创。",
    example:"这歌就是几首热歌缝合出来的。"}]},
  {abbr:"已老实", freq:3, meanings:[{type:"net", field:"网络流行语", full:"我认怂了",
    plain:"表示自己服了、认输了、不敢再折腾了。",
    example:"被现实毒打之后，已老实。"}]},
  {abbr:"尊嘟假嘟", freq:3, meanings:[{type:"net", field:"网络流行语", full:"真的假的",
    plain:"“真的假的”的可爱版谐音，用来说话卖萌。",
    example:"尊嘟假嘟，你也去？"}]},
  {abbr:"显眼包", freq:4, meanings:[{type:"net", field:"网络流行语", full:"爱出风头的人",
    plain:"指特别爱表现、走到哪都很引人注意的人。多数时候是调侃，不一定是骂人。",
    example:"他一穿这身衣服就成了显眼包。"}]},
  {abbr:"松弛感", freq:3, meanings:[{type:"net", field:"网络流行语", full:"从容不紧绷的状态",
    plain:"指一个人不急不躁、不焦虑，做什么都很放松、很自然的那种状态。",
    example:"她有种天生的松弛感。"}]},
  {abbr:"u1s1", freq:4, meanings:[{type:"net", field:"网络流行语", full:"有一说一",
    plain:"用数字和字母拼出来的谐音。意思是“说句公道话”“客观来讲”。",
    example:"u1s1，这波操作确实可以。"}]},
  {abbr:"yygq", freq:4, meanings:[{type:"net", field:"网络流行语", full:"阴阳怪气",
    plain:"拼音首字母缩写。指说话不直接说，拐着弯讽刺人。",
    example:"别 yygq 了，有话直说。"}]},
  {abbr:"nsdd", freq:4, meanings:[{type:"net", field:"网络流行语", full:"你说得对",
    plain:"拼音首字母缩写。表示同意对方说的话。",
    example:"nsdd，你说什么都对。"}]},
  {abbr:"zqsg", freq:4, meanings:[{type:"net", field:"网络流行语 / 追星", full:"真情实感",
    plain:"拼音首字母缩写。意思是动了真感情。",
    example:"我 zqsg 追了这个团五年。"}]},
  {abbr:"dbq", freq:4, meanings:[{type:"net", field:"网络流行语", full:"对不起",
    plain:"拼音首字母缩写，就是道歉用的“对不起”。",
    example:"dbq，我来晚了。"}]},
  {abbr:"bdjw", freq:3, meanings:[{type:"net", field:"网络流行语", full:"不懂就问",
    plain:"拼音首字母缩写。表示虚心请教。",
    example:"bdjw，这个梗是什么意思？"}]},
  {abbr:"FOMO", freq:3, meanings:[{type:"net", field:"网络流行语 / 心理", full:"Fear of Missing Out（错失恐惧症）",
    plain:"看到别人都在做某件事，自己怕错过，也跟着做。",
    example:"看到朋友圈都在晒，FOMO 了，我也去买了。"}]},
  {abbr:"xmsl", freq:4, meanings:[{type:"net", field:"网络流行语", full:"羡慕死了",
    plain:"拼音首字母缩写，表示非常羡慕。",
    example:"你居然抽到了隐藏款，xmsl！"}]},
  {abbr:"srds", freq:4, meanings:[{type:"net", field:"网络流行语", full:"虽然但是",
    plain:"拼音首字母缩写，表示虽然前面说了什么，但是后面有转折。",

/* =========================================================
   三、外部词库对接（nbnhhsh）
   ========================================================= */
const EXTERNAL_SOURCES = [
  {
    name: "nbnhhsh",
    urls: [
      "https://cdn.jsdelivr.net/gh/itorr/nbnhhsh@master/data/dict.json",
      "https://raw.githubusercontent.com/itorr/nbnhhsh/master/data/dict.json"
    ],
    map(item){
      const abbr = item.name || item.abbr || "";
      if(!abbr) return null;
      const trans = item.trans || item.translation || [];
      if(!trans.length) return null;
      return {
        abbr,
        freq: 2,
        status: "active",
        source: "nbnhhsh",
        meanings: trans.map(t => ({
          type: "net",
          field: "网络用语",
          full: t,
          plain: `网络缩写，完整展开为“${t}”。`,
          example: ""
        }))
      };
    }
  }
];

let TERMS = [];

async function fetchExternalTerms(){
  const collected = [];
  for(const src of EXTERNAL_SOURCES){
    let ok = false;
    for(const url of src.urls){
      try{
        const res = await fetch(url, { cache:"force-cache" });
        if(!res.ok) continue;
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data.data || []);
        for(const item of arr){
          const mapped = src.map(item);
          if(mapped) collected.push(mapped);
        }
        ok = true;
        console.log(`[${src.name}] 外部词库加载成功，${arr.length} 条`);
        break;
      }catch(e){}
    }
    if(!ok) console.warn(`[${src.name}] 外部词库加载失败，已跳过`);
  }
  return collected;
}

async function buildTermDatabase(){
  const external = await fetchExternalTerms();
  const merged = [...LOCAL_TERMS];
  const localAbbrs = new Set(LOCAL_TERMS.map(t => t.abbr.toLowerCase()));
  for(const et of external){
    if(!localAbbrs.has(et.abbr.toLowerCase())){
      merged.push(et);
      localAbbrs.add(et.abbr.toLowerCase());
    }
  }
  return merged;
}

/* =========================================================
   四、渲染逻辑
   ========================================================= */
const TYPE_LABEL = { net:"网络梗", pro:"专业术语" };
const HOT = ["PR","CP","AE","JD","DDL","yyds","内卷","水印圈","绘画圈","设圈"];

const state = { kw:"", cat:"all" };

const $q      = document.getElementById("q");
const $result = document.getElementById("result");
const $stat   = document.getElementById("stat");
const $hot    = document.getElementById("hot");

function escapeHTML(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function hl(text){
  const safe = escapeHTML(text);
  if(!state.kw) return safe;
  const q = state.kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try{ return safe.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`); }
  catch(e){ return safe; }
}

function searchTerms(){
  const q = state.kw.trim().toLowerCase();
  const out = [];
  for(const t of TERMS){
    const ms = t.meanings.filter(m => state.cat === "all" || m.type === state.cat);
    if(!ms.length) continue;
    if(!q){ out.push({ t, ms, rank:0, freq:t.freq||3 }); continue; }

    const exact = t.abbr.toLowerCase() === q;
    if(exact){ out.push({ t, ms, rank:2, freq:t.freq||3 }); continue; }

    const fuzzy = ms.filter(m =>
      (m.full||"").toLowerCase().includes(q) ||
      (m.plain||"").toLowerCase().includes(q) ||
      (m.field||"").toLowerCase().includes(q) ||
      t.abbr.toLowerCase().includes(q)
    );
    if(fuzzy.length) out.push({ t, ms:fuzzy, rank:1, freq:t.freq||3 });
  }
  return out.sort((a,b) => b.rank - a.rank || b.freq - a.freq);
}

function searchCircles(){
  const q = state.kw.trim().toLowerCase();
  return CIRCLES.filter(c => {
    if(!q) return true;
    if(c.name.toLowerCase().includes(q) || c.intro.toLowerCase().includes(q)) return true;
    return c.slang.some(s =>
      s.t.toLowerCase().includes(q) || s.d.toLowerCase().includes(q));
  }).map(c => {
    if(!q) return c;
    if(c.name.toLowerCase().includes(q) || c.intro.toLowerCase().includes(q)) return c;
    return { ...c, slang: c.slang.filter(s =>
      s.t.toLowerCase().includes(q) || s.d.toLowerCase().includes(q)) };
  });
}

function render(){
  const showTerms   = state.cat !== "circle";
  const showCircles = state.cat === "all" || state.cat === "circle";

  const terms   = showTerms   ? searchTerms()   : [];
  const circles = showCircles ? searchCircles() : [];

  const totalSlang = CIRCLES.reduce((n,c) => n + c.slang.length, 0);
  if(state.kw){
    $stat.textContent = `找到 ${terms.length} 个缩写 · ${circles.length} 个圈子`;
  }else{
    $stat.textContent = `收录 ${TERMS.length} 个缩写 · ${CIRCLES.length} 个圈子 · ${totalSlang} 条圈内黑话`;
  }

  if(!terms.length && !circles.length){
    $result.innerHTML = `
      <div class="empty">
        <strong>没有找到「${escapeHTML(state.kw)}」</strong>
        <p>换个词试试，或者切换上方分类看看</p>
      </div>`;
    return;
  }

  let html = "";

  html += terms.map(({ t, ms }) => `
    <article class="card">
      <div class="card-head">
        <h2>${hl(t.abbr)}</h2>
        <span class="count">${ms.length} 种含义</span>
      </div>
      ${ms.map(m => `
        <div class="meaning ${m.type}">
          <div class="m-top">
            <span class="badge ${m.type}">${TYPE_LABEL[m.type]}</span>
            <span class="field">${hl(m.field)}</span>
          </div>
          <div class="full">${hl(m.full)}</div>
          <div class="plain"><span class="tag">大白话</span>${hl(m.plain)}</div>
          ${m.example ? `<p class="example">例：${hl(m.example)}</p>` : ""}
        </div>
      `).join("")}
    </article>
  `).join("");

  html += circles.map(c => `
    <article class="circle-card">
      <div class="circle-head">
        <span class="c-icon">${c.icon}</span>
        <div>
          <h3>${hl(c.name)}</h3>
          <p class="c-intro">${hl(c.intro)}</p>
        </div>
      </div>
      <div class="slang-grid">
        ${c.slang.map(s => `
          <div class="slang">
            <span class="s-t">${hl(s.t)}</span>
            <span class="s-d">${hl(s.d)}</span>
            ${s.e ? `<span class="s-e">例：${hl(s.e)}</span>` : ""}
          </div>
        `).join("")}
      </div>
    </article>
  `).join("");

  $result.innerHTML = html;
}

/* =========================================================
   五、交互绑定
   ========================================================= */
$q.addEventListener("input", () => { state.kw = $q.value; render(); });
document.getElementById("btn").addEventListener("click", () => { state.kw = $q.value; render(); });
$q.addEventListener("keydown", e => { if(e.key === "Enter"){ state.kw = $q.value; render(); } });

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.cat = btn.dataset.cat;
  render();
});

$hot.innerHTML = `<span>热门：</span>` +
  HOT.map(k => `<button data-kw="${k}">${k}</button>`).join("");
$hot.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  $q.value = btn.dataset.kw;
  state.kw = btn.dataset.kw;
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
});

document.getElementById("genBtn").addEventListener("click", () => {
  const abbr = document.getElementById("f-abbr").value.trim();
  const type = document.getElementById("f-type").value;
  const field = document.getElementById("f-field").value.trim();
  const full = document.getElementById("f-full").value.trim();
  const plain = document.getElementById("f-plain").value.trim();
  const example = document.getElementById("f-example").value.trim();

  if (!abbr || !field || !full || !plain) {
    alert("请至少填写【缩写字母】【所属领域】【全称】【大白话解释】");
    return;
  }

  const data = {
    abbr: abbr,
    type: type,
    field: field,
    full: full,
    plain: plain,
    example: example
  };

  document.getElementById("subInput").value = JSON.stringify(data, null, 2);
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const ta = document.getElementById("subInput");
  if(!ta.value.trim()){ alert("还没有内容可复制"); return; }
  try{
    await navigator.clipboard.writeText(ta.value);
    alert("已复制，粘贴给维护者即可收录");
  }catch(e){
    ta.select();
    document.execCommand("copy");
    alert("已复制（兼容模式）");
  }
});

/* =========================================================
   六、启动
   ========================================================= */
(async function init(){
  TERMS = [...LOCAL_TERMS];
  render();

  try{
    const merged = await buildTermDatabase();
    if(merged.length > LOCAL_TERMS.length){
      TERMS = merged;
      render();
      console.log(`外部词库合并完成，当前共 ${TERMS.length} 个缩写`);
    }
  }catch(e){
    console.warn("外部词库合并失败，继续使用本地库", e);
  }
})();
</script>

/* =========================================================
   三、外部词库对接（nbnhhsh）
   ========================================================= */
const EXTERNAL_SOURCES = [
  {
    name: "nbnhhsh",
    urls: [
      "https://cdn.jsdelivr.net/gh/itorr/nbnhhsh@master/data/dict.json",
      "https://raw.githubusercontent.com/itorr/nbnhhsh/master/data/dict.json"
    ],
    map(item){
      const abbr = item.name || item.abbr || "";
      if(!abbr) return null;
      const trans = item.trans || item.translation || [];
      if(!trans.length) return null;
      return {
        abbr,
        freq: 2,
        status: "active",
        source: "nbnhhsh",
        meanings: trans.map(t => ({
          type: "net",
          field: "网络用语",
          full: t,
          plain: `网络缩写，完整展开为“${t}”。`,
          example: ""
        }))
      };
    }
  }
];

let TERMS = [];

async function fetchExternalTerms(){
  const collected = [];
  for(const src of EXTERNAL_SOURCES){
    let ok = false;
    for(const url of src.urls){
      try{
        const res = await fetch(url, { cache:"force-cache" });
        if(!res.ok) continue;
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data.data || []);
        for(const item of arr){
          const mapped = src.map(item);
          if(mapped) collected.push(mapped);
        }
        ok = true;
        console.log(`[${src.name}] 外部词库加载成功，${arr.length} 条`);
        break;
      }catch(e){}
    }
    if(!ok) console.warn(`[${src.name}] 外部词库加载失败，已跳过`);
  }
  return collected;
}

async function buildTermDatabase(){
  const external = await fetchExternalTerms();
  const merged = [...LOCAL_TERMS];
  const localAbbrs = new Set(LOCAL_TERMS.map(t => t.abbr.toLowerCase()));
  for(const et of external){
    if(!localAbbrs.has(et.abbr.toLowerCase())){
      merged.push(et);
      localAbbrs.add(et.abbr.toLowerCase());
    }
  }
  return merged;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function hl(text){
  const safe = escapeHTML(text);
  if(!state.kw) return safe;
  const q = state.kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try{ return safe.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`); }
  catch(e){ return safe; }
}

function searchTerms(){
  const q = state.kw.trim().toLowerCase();
  const out = [];
  for(const t of TERMS){
    const ms = t.meanings.filter(m => state.cat === "all" || m.type === state.cat);
    if(!ms.length) continue;
    if(!q){ out.push({ t, ms, rank:0, freq:t.freq||3 }); continue; }

    const exact = t.abbr.toLowerCase() === q;
    if(exact){ out.push({ t, ms, rank:2, freq:t.freq||3 }); continue; }

    const fuzzy = ms.filter(m =>
      (m.full||"").toLowerCase().includes(q) ||
      (m.plain||"").toLowerCase().includes(q) ||
      (m.field||"").toLowerCase().includes(q) ||
      t.abbr.toLowerCase().includes(q)
    );
    if(fuzzy.length) out.push({ t, ms:fuzzy, rank:1, freq:t.freq||3 });
  }
  return out.sort((a,b) => b.rank - a.rank || b.freq - a.freq);
}

function searchCircles(){
  const q = state.kw.trim().toLowerCase();
  return CIRCLES.filter(c => {
    if(!q) return true;
    if(c.name.toLowerCase().includes(q) || c.intro.toLowerCase().includes(q)) return true;
    return c.slang.some(s =>
      s.t.toLowerCase().includes(q) || s.d.toLowerCase().includes(q));
  }).map(c => {
    if(!q) return c;
    if(c.name.toLowerCase().includes(q) || c.intro.toLowerCase().includes(q)) return c;
    return { ...c, slang: c.slang.filter(s =>
      s.t.toLowerCase().includes(q) || s.d.toLowerCase().includes(q)) };
  });
}
